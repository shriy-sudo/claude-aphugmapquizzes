<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Africa Map Quiz</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--fg:#1f2326;--muted:#6a7076;--bd:#d9d7cf;--ocean:#cfe0ea;--in:#f4f1e8;--out:#b9b9b9;--ln:#8d8c82;--ac:#e4572e;--ok:#2e8b57;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191b;--card:#222527;--fg:#ecece8;--muted:#9aa0a6;--bd:#3a3e41;--ocean:#1f2f3b;--in:#5c5b52;--out:#2f3033;--ln:#403f3a}}
:root[data-theme="dark"]{--bg:#17191b;--card:#222527;--fg:#ecece8;--muted:#9aa0a6;--bd:#3a3e41;--ocean:#1f2f3b;--in:#5c5b52;--out:#2f3033;--ln:#403f3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
fieldset{border:0;padding:0;margin:0 0 16px}
legend{font-weight:600;margin-bottom:8px}
.opt{display:block;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.opt small{color:var(--muted);display:block}
button{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:9px 14px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;color:var(--muted);font-size:14px}
#map svg{width:100%;height:auto;max-height:58vh;border-radius:10px;display:block;border:1px solid var(--bd)}
.in{fill:var(--in)}.out{fill:var(--out)}.in,.out{stroke:var(--ln);stroke-width:.6}
.hit{fill:var(--ac);stroke:var(--ac);stroke-width:1}
.badge{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;font-size:13px;color:var(--muted)}
input[type=text]{flex:1;min-width:180px;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
#fb{min-height:24px;margin:8px 0 0;font-weight:600}
.bad{color:var(--ac)}.good{color:var(--ok)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#bank{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow-y:auto;padding-top:4px}
#bank button{padding:5px 10px;font-size:14px;border-radius:99px}
.miss{color:var(--muted);columns:2;padding-left:18px}
</style>
</head>
<body>
<main>
<h1>Africa Map Quiz</h1>
<p class="sub">Identify the highlighted feature. Lighter land belongs to the region being studied; grayed-out land is outside it.</p>

<section id="setup" class="card">
 <fieldset><legend>Mode</legend>
  <label class="opt"><input type="radio" name="mode" value="easy" checked> Easy<small>Pick or type from a word bank</small></label>
  <label class="opt"><input type="radio" name="mode" value="hard"> Hard<small>Type every answer from memory (small typos are forgiven)</small></label>
 </fieldset>
 <fieldset><legend>Region <small style="font-weight:400;color:var(--muted)">(choose one or more)</small></legend>
  <label class="opt"><input type="checkbox" name="reg" value="ALL" checked> Free game<small>Every feature from every region, shuffled</small></label>
  <label class="opt"><input type="checkbox" name="reg" value="SW"> Southwest Asia<small id="n-SW"></small></label>
  <label class="opt"><input type="checkbox" name="reg" value="NA"> Northern Africa<small id="n-NA"></small></label>
  <label class="opt"><input type="checkbox" name="reg" value="WA"> West Africa<small id="n-WA"></small></label>
  <label class="opt"><input type="checkbox" name="reg" value="CA"> Central Africa<small id="n-CA"></small></label>
  <label class="opt"><input type="checkbox" name="reg" value="ES"> Eastern &amp; Southern Africa<small id="n-ES"></small></label>
 </fieldset>
 <fieldset><legend>Feature type <small style="font-weight:400;color:var(--muted)">(choose one or more)</small></legend>
  <label class="opt"><input type="checkbox" name="typ" value="all" checked> All types<small id="t-all"></small></label>
  <label class="opt"><input type="checkbox" name="typ" value="pol"> Countries &amp; territories<small id="t-pol"></small></label>
  <label class="opt"><input type="checkbox" name="typ" value="mtn"> Mountains<small id="t-mtn"></small></label>
  <label class="opt"><input type="checkbox" name="typ" value="riv"> Rivers &amp; lakes<small id="t-riv"></small></label>
  <label class="opt"><input type="checkbox" name="typ" value="sea"> Seas, oceans, straits &amp; canals<small id="t-sea"></small></label>
  <label class="opt"><input type="checkbox" name="typ" value="land"> Peninsulas, deserts &amp; land regions<small id="t-land"></small></label>
 </fieldset>
 <button class="pri" id="go">Start quiz</button>
</section>

<section id="quiz" class="card" hidden>
 <div class="bar"><span id="prog"></span><span><span class="badge" id="kind"></span> <button id="quit">Menu</button></span></div>
 <div id="map"></div>
 <div class="row" style="margin-top:12px">
  <input type="text" id="ans" placeholder="What is the highlighted feature?" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button class="pri" id="sub">Check</button><button id="skip">Skip</button>
 </div>
 <p id="fb" aria-live="polite"></p>
 <div id="bankwrap" hidden><div class="sub" style="margin:8px 0 4px">Word bank</div><div id="bank"></div></div>
</section>

<section id="end" class="card" hidden>
 <h2 id="score" style="margin-top:0"></h2>
 <div id="missed"></div>
 <div class="row" style="margin-top:12px"><button class="pri" id="retry">Retry missed</button><button id="again">Back to menu</button></div>
</section>
</main>

// ---------- Matching ----------
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim().replace(/^the /,'');
const FULL=new Set(F.map(f=>norm(f.n)));
F.forEach(f=>{const b=norm(f.n),v=[b,...f.a.map(norm)];
 if(!/^(bering|ural)/.test(b)){const s=b.replace(/ (river|mountains|peninsula|ocean|sea|desert|plain|strait|canal)$/,'').replace(/^(lake|sea of|bay of|strait of|cape of) /,'');if(s!==b&&!FULL.has(s))v.push(s)}
 f.v=v});
const ALLV=new Set(F.flatMap(f=>f.v));
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function check(f,val){const v=norm(val);if(!v)return false;if(f.v.includes(v))return true;if(ALLV.has(v)||v.length<7)return false;return f.v.some(x=>x.length>=7&&lev(x,v)<=1)}

// ---------- Map ----------
let TOPO=[];
try{const t=Datamap.prototype.worldTopo;TOPO=topojson.feature(t,t.objects.world).features.filter(x=>x.id!=='ATA')}catch(e){console.error('Map data failed to load',e)}
function mapSvg(f,vk){
 const [x0,x1,y0,y1]=R[vk].v,W=1000,set=new Set(CS[vk]);
 const proj=d3.geo.mercator().scale(W/((x1-x0)*Math.PI/180)).translate([0,0]);
 const p0=proj([x0,y1]),p1=proj([x1,y0]),H=Math.round(p1[1]-p0[1]);
 const kk=W/(x1-x0),Y=la=>kk*180/Math.PI*Math.log(Math.tan(Math.PI/4+la*Math.PI/360));
 proj.translate([-p0[0],-p0[1]]).clipExtent([[-40,-40],[W+40,H+40]]);
 const path=d3.geo.path().projection(proj),P=pt=>[(pt[0]-x0)*kk,Y(y1)-Y(Math.min(pt[1],85))],fmt=pts=>pts.map((p,i)=>(i?'L':'M')+P(p).map(n=>n.toFixed(1)).join(' ')).join('');
 let h=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map with a highlighted feature"><rect width="${W}" height="${H}" fill="var(--ocean)"/>`;
 let box=null;
 const sea=f.k==='Sea / Ocean'&&Array.isArray(f.g),ac='var(--ac)';
 if(sea)f.g.forEach(r=>{h+=`<path d="${fmt(r)}Z" fill="${ac}" fill-opacity=".8"/>`});
 const sc=proj.scale(),path2=d3.geo.path().projection(d3.geo.mercator().scale(sc).translate([-p0[0]+sc*2*Math.PI,-p0[1]]).clipExtent([[-40,-40],[W+40,H+40]]));
 TOPO.forEach(c=>{const hit=!!f.m&&(f.m.includes(c.id)||f.m.includes(c.properties.name)),cl=hit?'hit':set.has(c.id)||set.has(c.properties.name)?'in':'out',d=path(c);
  if(d)h+=`<path d="${d}" class="${cl}"/>`;
  if(x1>180&&c.id==='RUS'){const d2=path2(c);if(d2)h+=`<path d="${d2}" class="${cl}"/>`}
  if(hit&&d){const b=path.bounds(c);box=box?[Math.min(box[0],b[0][0]),Math.min(box[1],b[0][1]),Math.max(box[2],b[1][0]),Math.max(box[3],b[1][1])]:[b[0][0],b[0][1],b[1][0],b[1][1]]}});
 if(f.k==='Country'&&typeof f.g==='string'&&!box&&FB[f.g]){const q=P(FB[f.g]);box=[q[0],q[1],q[0],q[1]]}
 let pts=[];
 if(f.k==='Mountains'){h+=`<path d="${fmt(f.g)}" fill="none" stroke="${ac}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>`;pts=f.g.map(P)}
 else if(f.k==='River'||f.k==='Canal'){h+=`<path d="${fmt(f.g)}" fill="none" stroke="${ac}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;pts=f.g.map(P)}
 else if(Array.isArray(f.g)){const wat=/Sea|Lake|Strait/.test(f.k),big=sea&&BIG.has(f.n);
  f.g.forEach(r=>{if(!big)h+=`<path d="${fmt(r)}Z" fill="${ac}" fill-opacity="${sea?.2:wat?.45:/Desert|Plain/.test(f.k)?.5:.75}" stroke="${ac}" stroke-width="1.5"${wat?' stroke-dasharray="5 3"':''}/>`;pts.push(...r.map(P))})}
 if(pts.length){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);box=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}
 if(box&&(f.ring||Math.max(box[2]-box[0],box[3]-box[1])<30)){const cx=(box[0]+box[2])/2,cy=(box[1]+box[3])/2,r=Math.max(box[2]-box[0],box[3]-box[1])/2+12;
  h+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${ac}" stroke-width="2.5"/>`}
 return h+'</svg>';
}

// ---------- Quiz flow ----------
const $=id=>document.getElementById(id),S={};
const show=id=>['setup','quiz','end'].forEach(s=>$(s).hidden=s!==id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
for(const k in R)if($('n-'+k))$('n-'+k).textContent=F.filter(f=>f.r.includes(k)).length+' features';
function start(items,mode,region){Object.assign(S,{items:shuffle(items),mode,region,i:0,score:0,missed:[],tries:0,lock:false,left:new Set(items.map(f=>f.n))});show('quiz');$('bankwrap').hidden=mode!=='easy';render()}
function render(){
 const f=S.items[S.i],vk=f.vw||(S.region.includes('ALL')?f.r[0]:(f.r.find(x=>S.region.includes(x))||f.r[0]));
 $('map').innerHTML=mapSvg(f,vk);$('kind').textContent=f.k;
 $('prog').textContent=`Question ${S.i+1} of ${S.items.length} · Score ${S.score}`;
 $('ans').value='';$('fb').textContent='';$('fb').className='';S.tries=0;S.lock=false;
 S.stage=1;$('ans').placeholder='What is the highlighted feature?';if(S.mode==='easy')bank([...S.left].sort((a,c)=>a.localeCompare(c)));
 if(!matchMedia('(pointer:coarse)').matches)$('ans').focus();
}
function say(t,c){const e=$('fb');e.textContent=t;e.className=c}
function advance(ms){S.lock=true;setTimeout(()=>{S.i++;S.i>=S.items.length?finish():render()},ms)}
function bank(list){const b=$('bank');b.innerHTML='';list.forEach(n=>{const e=document.createElement('button');e.textContent=n;e.onclick=()=>submit(n);b.appendChild(e)})}
function wrong(f){S.tries++;say('Not quite — try again.','bad');const a=$('ans');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');
 if(S.tries>=2&&S.mode==='hard')say(`Not quite. Hint: it starts with “${(S.stage===2?f.ctl:f.n)[0]}”.`,'bad')}
function done(f,m){if(!S.tries)S.score++;else S.missed.push(f);S.left.delete(f.n);say(m,'good');advance(f.ctl?1600:650)}
function submit(val){
 if(S.lock)return;const f=S.items[S.i];
 if(S.stage===2){norm(val)===norm(f.ctl)?done(f,`Correct! ${f.n} is controlled by ${f.ctl}.`):wrong(f);return}
 if(check(f,val)){
  if(f.ctl){S.stage=2;say('Correct! Now: which country controls it?','good');$('ans').value='';$('ans').placeholder='Which country controls it?';if(S.mode==='easy')bank(shuffle(['Spain','Portugal','France','Morocco','Italy','Egypt']));return}
  done(f,'Correct! '+f.n)}
 else wrong(f)
}
$('sub').onclick=()=>submit($('ans').value);
$('ans').onkeydown=e=>{if(e.key==='Enter')submit($('ans').value)};
$('skip').onclick=()=>{if(S.lock)return;const f=S.items[S.i];S.missed.push(f);S.left.delete(f.n);say('It’s '+f.n+(f.ctl?', controlled by '+f.ctl:'')+'.','bad');advance(1500)};
function finish(){
 const miss=[...new Set(S.missed)];show('end');
 $('score').textContent=`You got ${S.score} of ${S.items.length} on the first try`;
 $('missed').innerHTML=miss.length?'<p>Review these:</p><ul class="miss">'+miss.map(f=>`<li>${f.n}</li>`).join('')+'</ul>':'<p>A perfect run — nicely done!</p>';
 $('retry').hidden=!miss.length;S.retryList=miss;
}
const CAT=f=>f.k==='Country'||f.k==='Territory'?'pol':f.k==='Mountains'?'mtn':f.k==='River'||/^Lake /.test(f.n)?'riv':['Peninsula','Region','Desert','Plain','Cape'].includes(f.k)?'land':'sea';
const pool=(rs,ts)=>F.filter(f=>(rs.includes('ALL')||f.r.some(x=>rs.includes(x)))&&(ts.includes('all')||ts.includes(CAT(f))));
const val=n=>document.querySelector(`[name=${n}]:checked`).value;
const vals=n=>[...document.querySelectorAll(`[name=${n}]:checked`)].map(e=>e.value);
function upd(){document.querySelectorAll('[name=typ]').forEach(e=>{const n=pool(vals('reg'),[e.value]).length;$('t-'+e.value).textContent=n+' features';e.disabled=!n;e.parentElement.style.opacity=n?1:.45;if(!n)e.checked=false});
 if(!vals('typ').length)document.querySelector('[name=typ][value=all]').checked=true}
function multi(n,all,after){const es=[...document.querySelectorAll(`[name=${n}]`)],A=es.find(x=>x.value===all),O=es.filter(x=>x!==A);
 es.forEach(e=>e.onchange=()=>{
  if(e===A&&A.checked)O.forEach(x=>x.checked=false);
  else if(e!==A&&e.checked)A.checked=false;
  const en=O.filter(x=>!x.disabled);
  if(!en.some(x=>x.checked)||en.every(x=>x.checked)){O.forEach(x=>x.checked=false);A.checked=true}
  after()})}
multi('reg','ALL',upd);multi('typ','all',()=>{});upd();
$('go').onclick=()=>start(pool(vals('reg'),vals('typ')),val('mode'),vals('reg'));
$('retry').onclick=()=>start(S.retryList,S.mode,S.region);
$('again').onclick=()=>show('setup');
$('quit').onclick=()=>show('setup');
</script>
